plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.institucion'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.cucumber:cucumber-java:8.0.4'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:8.0.4'
	testImplementation 'io.cucumber:cucumber-spring:8.0.4'
	testImplementation 'org.junit.platform:junit-platform-suite'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'acceptance', 'e2e', 'postgres'
	}
	// La suite de Cucumber se ejecuta solo con acceptanceTest, nunca en la suite rápida.
	exclude '**/CucumberAcceptanceSuite.class'
}

def acceptanceTest = tasks.register('acceptanceTest', Test) {
	description = 'Ejecuta las pruebas de aceptación etiquetadas con acceptance.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'acceptance'
	}
	// Permite acotar la traza por requisito: ./gradlew acceptanceTest -PcucumberTags=@FR-012
	if (project.hasProperty('cucumberTags')) {
		systemProperty 'cucumber.filter.tags', project.property('cucumberTags')
	}
	shouldRunAfter tasks.named('test')
}

def e2eTest = tasks.register('e2eTest', Test) {
	description = 'Ejecuta las pruebas E2E etiquetadas con e2e.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'e2e'
	}
	exclude '**/CucumberAcceptanceSuite.class'
	shouldRunAfter tasks.named('test')
}

// Las pruebas de concurrencia verifican los bloqueos de PostgreSQL, que H2 no
// reproduce con fidelidad. Corren contra un PostgreSQL real vía TEST_DB_URL y
// quedan fuera de `test` para que la suite rápida siga sin base externa.
def postgresTest = tasks.register('postgresTest', Test) {
	description = 'Ejecuta las pruebas que necesitan un PostgreSQL real.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'postgres'
	}
	exclude '**/CucumberAcceptanceSuite.class'
}

pitest {
	targetClasses = ['com.institucion.reservas.service.impl.*']
	targetTests = ['com.institucion.reservas.service.**']
	pitestVersion = '1.30.2'
	junit5PluginVersion = '1.2.3'
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	mutationThreshold = 80
	coverageThreshold = 90
	threads = 2
}

jacoco {
	toolVersion = '0.8.16'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			element = 'CLASS'
			includes = ['com.institucion.reservas.service.impl.*']
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification
check.dependsOn tasks.named('pitest')
check.dependsOn acceptanceTest
check.dependsOn e2eTest
