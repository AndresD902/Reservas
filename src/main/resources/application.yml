spring:
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sistema_reservas
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

reservas:
  finalizacion:
    frecuencia: PT5M
