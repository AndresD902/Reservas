name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline de integración continua
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      - name: Compilación
        run: ./gradlew compileJava compileTestJava --console=plain

      - name: Pruebas unitarias e integración
        run: ./gradlew test --console=plain

      - name: Mutation testing (PIT)
        run: ./gradlew pitest --console=plain

      - name: Cobertura JaCoCo
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification --console=plain

      - name: Pruebas de aceptación
        run: ./gradlew acceptanceTest --console=plain

      - name: Pruebas E2E
        run: ./gradlew e2eTest --console=plain

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco
          if-no-files-found: warn

      - name: Publicar reporte de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: build/reports/pitest
          if-no-files-found: warn

      - name: Publicar reportes de aceptación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: |
            build/reports/tests/acceptanceTest
            build/test-results/acceptanceTest
          if-no-files-found: warn

      - name: Publicar reportes E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            build/reports/tests/e2eTest
            build/test-results/e2eTest
          if-no-files-found: warn
