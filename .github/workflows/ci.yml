name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline de integración continua
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      - name: Compilación
        run: ./gradlew compileJava compileTestJava --console=plain

      - name: Pruebas unitarias e integración
        run: ./gradlew test --console=plain

      - name: Mutation testing (PIT)
        run: ./gradlew pitest --console=plain

      - name: Cobertura JaCoCo
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification --console=plain

      - name: Pruebas de aceptación
        run: ./gradlew acceptanceTest --console=plain

      - name: Pruebas E2E
        run: ./gradlew e2eTest --console=plain

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco
          if-no-files-found: warn

      - name: Publicar reporte de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: build/reports/pitest
          if-no-files-found: warn

      - name: Publicar reportes de aceptación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: |
            build/reports/tests/acceptanceTest
            build/test-results/acceptanceTest
          if-no-files-found: warn

      - name: Publicar reportes E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            build/reports/tests/e2eTest
            build/test-results/e2eTest
          if-no-files-found: warn

  frontend:
    name: Interfaz web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Verificación de tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Pruebas unitarias y de componentes
        working-directory: frontend
        run: npm test

      - name: Compilación
        working-directory: frontend
        run: npm run build

  serenity-e2e:
    name: E2E de navegador con Serenity y Gherkin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: admin123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      - name: Levantar el stack con Docker Compose
        run: |
          for attempt in 1 2 3; do
            if docker compose --profile frontend up -d --build; then
              echo "Stack levantado en el intento $attempt"
              exit 0
            fi
            echo "Fallo al levantar el stack (intento $attempt); se reintenta en 10s"
            docker compose --profile frontend down -v || true
            sleep 10
          done
          echo "No se pudo levantar el stack tras 3 intentos"
          docker compose --profile frontend logs --tail 100 || true
          exit 1

      - name: Esperar a que la interfaz y la API respondan
        run: |
          deadline=$((SECONDS + 300))
          consecutive=0
          while [ $SECONDS -lt $deadline ]; do
            frontend=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/login || true)
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/recursos || true)
            if [ "$frontend" = "200" ] && [ "$api" = "200" ]; then
              consecutive=$((consecutive + 1))
              if [ $consecutive -ge 3 ]; then
                echo "Stack listo y estable (frontend=$frontend api=$api)"
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 3
          done
          echo "El stack no respondió de forma estable a tiempo"
          docker compose --profile frontend logs --tail 100
          exit 1

      - name: Instalar dependencias del sistema para Chromium
        run: sudo npx -y playwright@1.64.0 install-deps chromium

      - name: Instalar Chromium de Playwright
        run: ./gradlew installPlaywrightBrowsers --console=plain

      - name: Pruebas E2E de navegador con Serenity
        run: |
          if ./gradlew serenityE2ETest --console=plain; then
            exit 0
          fi
          echo "Serenity falló; se reintenta una vez para absorber intermitencias de la interfaz"
          ./gradlew serenityE2ETest --console=plain

      - name: Flujos Gherkin E2E de login
        if: always()
        run: |
          if ./gradlew e2eGherkinTest --console=plain; then
            exit 0
          fi
          echo "Gherkin falló; se reintenta una vez para absorber intermitencias de la interfaz"
          ./gradlew e2eGherkinTest --console=plain

      - name: Publicar reporte de Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: target/site/serenity
          if-no-files-found: warn

      - name: Publicar reporte Gherkin y videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-e2e-report
          path: |
            build/reports/cucumber
            build/e2e-videos
          if-no-files-found: warn

      - name: Bajar el stack
        if: always()
        run: docker compose --profile frontend down
