name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline de integración continua
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      - name: Compilación
        run: ./gradlew compileJava compileTestJava --console=plain

      - name: Pruebas unitarias e integración
        run: ./gradlew test --console=plain

      - name: Mutation testing (PIT)
        run: ./gradlew pitest --console=plain

      - name: Cobertura JaCoCo
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification --console=plain

      - name: Pruebas de aceptación
        run: ./gradlew acceptanceTest --console=plain

      - name: Pruebas E2E
        run: ./gradlew e2eTest --console=plain

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco
          if-no-files-found: warn

      - name: Publicar reporte de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: build/reports/pitest
          if-no-files-found: warn

      - name: Publicar reportes de aceptación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: |
            build/reports/tests/acceptanceTest
            build/test-results/acceptanceTest
          if-no-files-found: warn

      - name: Publicar reportes E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            build/reports/tests/e2eTest
            build/test-results/e2eTest
          if-no-files-found: warn

  frontend:
    name: Interfaz web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Verificación de tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Pruebas unitarias y de componentes
        working-directory: frontend
        run: npm test

      - name: Compilación
        working-directory: frontend
        run: npm run build

  browser-e2e:
    name: E2E de navegador
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sistema_reservas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d sistema_reservas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: local
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de la interfaz
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E de navegador
        working-directory: frontend
        run: npm run test:e2e

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
