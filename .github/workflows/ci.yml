name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline de integración continua
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      - name: Compilación
        run: ./gradlew compileJava compileTestJava --console=plain

      - name: Pruebas unitarias e integración
        run: ./gradlew test --console=plain

      - name: Mutation testing (PIT)
        run: ./gradlew pitest --console=plain

      - name: Cobertura JaCoCo
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification --console=plain

      - name: Pruebas de aceptación de autenticación
        run: ./gradlew authAcceptanceTest --console=plain

      - name: Pruebas de aceptación
        run: ./gradlew acceptanceTest --console=plain

      - name: Pruebas E2E
        run: ./gradlew e2eTest --console=plain

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco
          if-no-files-found: warn

      - name: Publicar reporte de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: build/reports/pitest
          if-no-files-found: warn

      - name: Publicar reportes de aceptación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: |
            build/reports/tests/authAcceptanceTest
            build/test-results/authAcceptanceTest
            build/reports/tests/acceptanceTest
            build/test-results/acceptanceTest
          if-no-files-found: warn

      - name: Publicar reportes E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            build/reports/tests/e2eTest
            build/test-results/e2eTest
          if-no-files-found: warn

  frontend:
    name: Interfaz web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Verificación de tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Pruebas unitarias y de componentes
        working-directory: frontend
        run: npm test

      - name: Compilación
        working-directory: frontend
        run: npm run build

  serenity-e2e:
    name: E2E de navegador con Serenity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: admin123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      - name: Levantar el stack con Docker Compose
        run: docker compose --profile frontend up -d --build

      - name: Esperar a que la interfaz y la API respondan
        run: |
          for i in $(seq 1 60); do
            frontend=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/login || true)
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/recursos || true)
            if [ "$frontend" = "200" ] && [ "$api" = "200" ]; then
              echo "Stack listo (frontend=$frontend api=$api)"
              exit 0
            fi
            sleep 3
          done
          echo "El stack no respondió a tiempo"
          docker compose logs --tail 50
          exit 1

      - name: Instalar dependencias del sistema para Chromium
        run: sudo npx -y playwright@1.64.0 install-deps chromium

      - name: Instalar Chromium de Playwright
        run: ./gradlew installPlaywrightBrowsers --console=plain

      - name: Pruebas E2E de navegador con Serenity
        run: ./gradlew serenityE2ETest --console=plain

      - name: Publicar reporte de Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: target/site/serenity
          if-no-files-found: warn

      - name: Bajar el stack
        if: always()
        run: docker compose --profile frontend down
